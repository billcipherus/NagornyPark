<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://api-maps.yandex.ru/2.1/?apikey=f1f1d7d7-cd6e-4883-b0d1-46ac439370d4&lang=ru_RU"></script>
    <link href="css/mapStyle.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/initMap.js"></script>
    <script src="js/changeThemeMap.js"></script>
    <script src="js/offcanvasMovng.js"></script>
  </head>

  <body>
    <button
      class="btn btn-primary m-2"
      type="button"
      id="themeChanger"
      onclick="changeTheme()"
    >
      Смена темы
    </button>

    <div
      class="offcanvas offcanvas-bottom"
      tabindex="-1"
      id="offcanvasBottom"
      aria-labelledby="offcanvasBottomLabel"
      data-bs-backdrop="false"
      data-bs-theme="light"
      data-bs-scroll="true"
    >
      <div class="offcanvas-header">
        <div id="offcanvasHandle"></div>
        <h5 class="offcanvas-title" id="offcanvasBottomLabel">
          Точки на карте:
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body small">
        <div class="menuList">
          <div class="itemList"></div>
        </div>
        <div class="itemInfo">
          <h3 class="itemTitle"></h3>
          <img class="itemImage" />
          <p class="infoDesc"></p>
          <p id="btnUndo">↩</p>
        </div>
      </div>
    </div>
    <div id="map"></div>
  </body>
</html>
